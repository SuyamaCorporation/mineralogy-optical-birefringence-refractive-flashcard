<!DOCTYPE html><html lang="ja"><head>  <meta charset="UTF-8">  <meta name="viewport" content="width=device-width, initial-scale=1.0">  <title>鉱物光学特性・複屈折・屈折率フラッシュカード</title>  <script src="https://cdn.tailwindcss.com"></script>  <style>    .card-wrap { perspective: 900px; }    .card-inner { transition: transform 0.55s cubic-bezier(.4,0,.2,1); transform-style: preserve-3d; }    .card-inner.flipped { transform: rotateY(180deg); }    .card-front, .card-back { backface-visibility: hidden; -webkit-backface-visibility: hidden; }    .card-back { transform: rotateY(180deg); }    .crystal-svg path, .crystal-svg polygon, .crystal-svg ellipse { transition: fill 0.3s; }    .opt-row { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; align-items: baseline; }  </style></head><body class="bg-indigo-50 min-h-screen">  <div class="max-w-2xl mx-auto px-4 py-6">    <header class="text-center mb-6">      <h1 class="text-2xl font-bold text-indigo-900">鉱物光学特性 フラッシュカード</h1>      <p class="text-sm text-indigo-600 mt-1">複屈折・屈折率・光学符号 学習ツール</p>    </header>    <!-- Tab Nav -->    <div class="flex gap-1 mb-6 bg-indigo-100 p-1 rounded-xl" role="tablist" aria-label="メインタブ">      <button id="tab-study" role="tab" aria-selected="true" aria-controls="panel-study"        class="flex-1 py-2 px-3 rounded-lg text-sm font-medium transition-colors bg-white text-indigo-900 shadow"        onclick="switchTab('study')">学習</button>      <button id="tab-list" role="tab" aria-selected="false" aria-controls="panel-list"        class="flex-1 py-2 px-3 rounded-lg text-sm font-medium transition-colors text-indigo-700 hover:bg-indigo-200"        onclick="switchTab('list')">一覧表</button>      <button id="tab-stats" role="tab" aria-selected="false" aria-controls="panel-stats"        class="flex-1 py-2 px-3 rounded-lg text-sm font-medium transition-colors text-indigo-700 hover:bg-indigo-200"        onclick="switchTab('stats')">統計</button>    </div>    <!-- Study Panel -->    <div id="panel-study" role="tabpanel" aria-labelledby="tab-study">      <!-- Mode selector -->      <div class="bg-white rounded-xl shadow p-3 mb-4">        <div class="flex flex-wrap gap-3 items-center">          <span class="text-xs font-medium text-gray-600">学習モード:</span>          <label class="flex items-center gap-1 text-xs cursor-pointer">            <input type="radio" name="minmode" value="name-to-props" checked onchange="setMode(this.value)" class="focus:ring-indigo-400">            鉱物名 → 光学特性          </label>          <label class="flex items-center gap-1 text-xs cursor-pointer">            <input type="radio" name="minmode" value="biref-to-name" onchange="setMode(this.value)" class="focus:ring-indigo-400">            複屈折値 → 鉱物名          </label>          <label class="flex items-center gap-1 text-xs cursor-pointer">            <input type="radio" name="minmode" value="spaced" onchange="setMode(this.value)" class="focus:ring-indigo-400">            復習優先          </label>        </div>      </div>      <!-- Crystal system filter -->      <div class="bg-white rounded-xl shadow p-3 mb-4">        <div class="flex flex-wrap gap-1 items-center">          <span class="text-xs font-medium text-gray-600 mr-1">晶系:</span>          <button id="sys-btn-all" onclick="setCrystalFilter('all')"            class="px-2 py-0.5 rounded text-xs bg-indigo-600 text-white focus:outline-none focus:ring-2 focus:ring-indigo-400">すべて</button>          <div id="sys-buttons"></div>        </div>      </div>      <!-- Progress bar -->      <div class="bg-white rounded-xl shadow px-4 py-2 mb-4 flex items-center justify-between">        <span class="text-sm text-gray-500">残り: <span id="remaining" class="font-bold text-indigo-700" aria-live="polite">-</span></span>        <div class="w-40 bg-gray-200 rounded-full h-2" role="progressbar"          aria-valuenow="0" aria-valuemin="0" aria-valuemax="100" id="prog-bar-wrap">          <div id="prog-bar" class="bg-indigo-500 h-2 rounded-full transition-all" style="width:0%"></div>        </div>        <span id="sess-score" class="text-sm text-gray-500" aria-live="polite">0/0</span>      </div>      <!-- Flash Card -->      <div class="card-wrap mb-4" style="min-height:260px; position:relative;">        <div id="flash-card" class="card-inner cursor-pointer select-none" onclick="flipCard()" role="button"          aria-label="カードをクリックして答えを確認" tabindex="0" onkeydown="if(event.key==='Enter'||event.key===' ')flipCard()">          <!-- Front -->          <div class="card-front bg-white rounded-xl shadow-lg p-6 min-h-[260px] flex flex-col">            <div class="flex items-start justify-between mb-2">              <span id="f-system" class="text-xs font-bold text-indigo-500 uppercase tracking-wide"></span>              <span id="f-group" class="text-xs text-gray-400 italic"></span>            </div>            <!-- Crystal SVG icon -->            <div class="flex justify-center mb-3">              <svg id="crystal-svg" class="crystal-svg" width="60" height="60" viewBox="0 0 60 60" aria-hidden="true">                <polygon id="crystal-shape" points="30,5 55,20 55,40 30,55 5,40 5,20" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/>                <line x1="30" y1="5" x2="30" y2="55" stroke="#a5b4fc" stroke-width="1" stroke-dasharray="3,3"/>                <line x1="5" y1="30" x2="55" y2="30" stroke="#a5b4fc" stroke-width="1" stroke-dasharray="3,3"/>              </svg>            </div>            <div class="flex-1 flex flex-col items-center justify-center text-center">              <div id="f-question-label" class="text-xs text-gray-400 mb-2"></div>              <div id="f-main" class="text-3xl font-bold text-gray-800 mb-1"></div>              <div id="f-sub" class="text-sm text-gray-500 font-mono"></div>            </div>            <div class="text-center text-xs text-gray-300 mt-auto">クリック / Enter でフリップ</div>          </div>          <!-- Back -->          <div class="card-back absolute inset-0 bg-indigo-800 text-white rounded-xl shadow-lg p-5 min-h-[260px] flex flex-col justify-start" aria-label="答え面">            <div class="text-sm font-bold text-indigo-200 mb-3" id="b-mineral-name"></div>            <div class="opt-row text-sm mb-3" id="b-props">              <!-- JS fills this -->            </div>            <div class="mt-auto text-xs text-indigo-300 italic" id="b-tip"></div>          </div>        </div>      </div>      <!-- Action buttons -->      <div id="answer-buttons" class="hidden flex gap-3 justify-center mb-2">        <button onclick="markCard(false)" aria-label="不正解"          class="flex-1 max-w-[160px] py-3 bg-red-500 text-white rounded-xl font-bold hover:bg-red-600 focus:outline-none focus:ring-2 focus:ring-red-400 transition-colors">          もう一度        </button>        <button onclick="markCard(true)" aria-label="正解"          class="flex-1 max-w-[160px] py-3 bg-green-500 text-white rounded-xl font-bold hover:bg-green-600 focus:outline-none focus:ring-2 focus:ring-green-400 transition-colors">          正解！        </button>      </div>      <div id="next-button" class="flex justify-center">        <button onclick="nextCard()"          class="px-8 py-3 bg-indigo-500 text-white rounded-xl font-bold hover:bg-indigo-600 focus:outline-none focus:ring-2 focus:ring-indigo-400 transition-colors">          次のカード →        </button>      </div>      <!-- Session complete -->      <div id="session-complete" class="hidden text-center bg-white rounded-xl shadow p-6 mt-4">        <div class="text-4xl mb-2">💎</div>        <div class="text-xl font-bold text-gray-800 mb-1">セッション完了！</div>        <div id="sess-result" class="text-gray-500 mb-4"></div>        <button onclick="restartSession()"          class="px-6 py-3 bg-indigo-600 text-white rounded-xl font-bold hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-400">          もう一度        </button>      </div>    </div>    <!-- List Panel -->    <div id="panel-list" role="tabpanel" aria-labelledby="tab-list" class="hidden">      <div class="bg-white rounded-xl shadow p-4 overflow-x-auto">        <h2 class="font-bold text-gray-800 mb-3">鉱物光学特性 一覧 (30鉱物)</h2>        <table class="w-full text-xs" aria-label="鉱物光学特性一覧テーブル">          <thead>            <tr class="bg-indigo-50 text-indigo-800">              <th class="p-2 text-left">鉱物名</th>              <th class="p-2 text-left">晶系</th>              <th class="p-2 text-right">nα</th>              <th class="p-2 text-right">nγ</th>              <th class="p-2 text-right">複屈折</th>              <th class="p-2 text-center">光学符号</th>              <th class="p-2 text-right">正解率</th>            </tr>          </thead>          <tbody id="list-tbody"></tbody>        </table>      </div>    </div>    <!-- Stats Panel -->    <div id="panel-stats" role="tabpanel" aria-labelledby="tab-stats" class="hidden">      <div class="bg-white rounded-xl shadow p-4 mb-4">        <div class="flex justify-between items-center mb-4">          <h2 class="font-bold text-gray-800">学習統計</h2>          <button onclick="clearStats()"            class="text-xs text-red-500 hover:text-red-700 focus:outline-none focus:ring-2 focus:ring-red-300 rounded px-2 py-1">リセット</button>        </div>        <div class="grid grid-cols-2 gap-3 mb-4">          <div class="bg-indigo-50 rounded-lg p-3 text-center">            <div id="st-total" class="text-2xl font-bold text-indigo-700">0</div>            <div class="text-xs text-gray-500">総回答数</div>          </div>          <div class="bg-green-50 rounded-lg p-3 text-center">            <div id="st-acc" class="text-2xl font-bold text-green-700">-</div>            <div class="text-xs text-gray-500">正解率</div>          </div>        </div>        <h3 class="text-sm font-bold text-gray-700 mb-2">要復習鉱物 (正解率 &lt; 70%)</h3>        <div id="weak-minerals" class="space-y-1 text-sm"></div>        <h3 class="text-sm font-bold text-gray-700 mt-4 mb-2">晶系別スコア</h3>        <div id="stats-by-system" class="space-y-2"></div>      </div>    </div>  </div>  <script>    // ===== Mineral Data =====    // n_alpha (nα), n_gamma (nγ), birefringence (δ), optical sign (+/-), extinction angle (°), system, group, tip    const MINERALS = [      { id:'qtz',  name:'石英 (Quartz)',         nameJa:'石英',       system:'三方',   group:'珪酸塩',    nAlpha:1.544, nGamma:1.553, bire:0.009,  sign:'+', extinct:0,   tip:'六角柱状・双錐形の劈開なし・低い一次色干渉色' },      { id:'cal',  name:'方解石 (Calcite)',       nameJa:'方解石',     system:'三方',   group:'炭酸塩',    nAlpha:1.486, nGamma:1.658, bire:0.172,  sign:'-', extinct:0,   tip:'高次干渉色・ロンボヘドロン劈開・二重屈折が顕著' },      { id:'fsp',  name:'長石 (Feldspar)',        nameJa:'長石',       system:'三斜/単斜', group:'珪酸塩', nAlpha:1.518, nGamma:1.527, bire:0.009,  sign:'+', extinct:5,   tip:'2方向劈開直交・アルバイト双晶・低一次色' },      { id:'prx',  name:'輝石 (Pyroxene)',        nameJa:'輝石',       system:'単斜',   group:'珪酸塩',    nAlpha:1.665, nGamma:1.700, bire:0.030,  sign:'+', extinct:40,  tip:'87°/93°劈開角・二次色干渉色・高い屈折率' },      { id:'hbl',  name:'角閃石 (Hornblende)',    nameJa:'角閃石',     system:'単斜',   group:'珪酸塩',    nAlpha:1.615, nGamma:1.645, bire:0.020,  sign:'-', extinct:25,  tip:'56°/124°劈開角・強い多色性(緑〜褐色)' },      { id:'olv',  name:'橄欖石 (Olivine)',       nameJa:'橄欖石',     system:'直方',   group:'珪酸塩',    nAlpha:1.635, nGamma:1.690, bire:0.040,  sign:'+', extinct:0,   tip:'高二次色・平行消光・非常に高い屈折率' },      { id:'bt',   name:'黒雲母 (Biotite)',       nameJa:'黒雲母',     system:'単斜',   group:'雲母',      nAlpha:1.565, nGamma:1.640, bire:0.040,  sign:'-', extinct:0,   tip:'底面劈開・強い多色性(薄茶〜暗褐)・高複屈折' },      { id:'ms',   name:'白雲母 (Muscovite)',     nameJa:'白雲母',     system:'単斜',   group:'雲母',      nAlpha:1.556, nGamma:1.600, bire:0.040,  sign:'-', extinct:1,   tip:'底面劈開・無色〜淡緑・ほぼ平行消光' },      { id:'grt',  name:'柘榴石 (Garnet)',        nameJa:'柘榴石',     system:'等軸',   group:'珪酸塩',    nAlpha:1.730, nGamma:1.730, bire:0.000,  sign:'等方', extinct:null, tip:'等方性・偏光下で常に消光・等軸晶系' },      { id:'sill', name:'珪線石 (Sillimanite)',   nameJa:'珪線石',     system:'直方',   group:'珪酸塩',    nAlpha:1.654, nGamma:1.683, bire:0.020,  sign:'+', extinct:0,   tip:'繊維状・平行消光・高温変成岩指標鉱物' },      { id:'kyan', name:'藍晶石 (Kyanite)',       nameJa:'藍晶石',     system:'三斜',   group:'珪酸塩',    nAlpha:1.712, nGamma:1.728, bire:0.016,  sign:'-', extinct:30,  tip:'青〜無色・2方向に異なる硬度・高圧変成岩指標' },      { id:'and',  name:'菫青石 (Cordierite)',    nameJa:'菫青石',     system:'直方',   group:'珪酸塩',    nAlpha:1.527, nGamma:1.542, bire:0.010,  sign:'-', extinct:0,   tip:'六方断面・多色性(青〜黄)・平行消光' },      { id:'ep',   name:'緑廉石 (Epidote)',       nameJa:'緑廉石',     system:'単斜',   group:'珪酸塩',    nAlpha:1.722, nGamma:1.779, bire:0.049,  sign:'+', extinct:5,   tip:'異常干渉色・黄〜ピスタチオ緑・高複屈折' },      { id:'zrn',  name:'ジルコン (Zircon)',      nameJa:'ジルコン',   system:'正方',   group:'珪酸塩',    nAlpha:1.920, nGamma:2.015, bire:0.060,  sign:'+', extinct:0,   tip:'非常に高屈折率・正方柱状・高次色干渉色' },      { id:'aln',  name:'アラナイト (Allanite)',  nameJa:'アラナイト', system:'単斜',   group:'珪酸塩',    nAlpha:1.690, nGamma:1.830, bire:0.100,  sign:'+', extinct:40,  tip:'放射性含有・褐色・高複屈折・まれに変質' },      { id:'tlc',  name:'滑石 (Talc)',            nameJa:'滑石',       system:'単斜',   group:'フィロ珪酸塩', nAlpha:1.539, nGamma:1.590, bire:0.050, sign:'-', extinct:0,  tip:'底面劈開・無色〜淡緑・硬度最低(1)' },      { id:'chl',  name:'緑泥石 (Chlorite)',      nameJa:'緑泥石',     system:'単斜',   group:'フィロ珪酸塩', nAlpha:1.571, nGamma:1.588, bire:0.010, sign:'-', extinct:0,  tip:'異常干渉色(ベルリンブルー)・緑〜薄緑' },      { id:'ser',  name:'絹雲母 (Sericite)',      nameJa:'絹雲母',     system:'単斜',   group:'雲母',      nAlpha:1.554, nGamma:1.598, bire:0.040,  sign:'-', extinct:1,   tip:'細粒白雲母・変質産物として頻出' },      { id:'dol',  name:'苦灰石 (Dolomite)',      nameJa:'苦灰石',     system:'三方',   group:'炭酸塩',    nAlpha:1.500, nGamma:1.679, bire:0.179,  sign:'-', extinct:0,   tip:'方解石に似るが高い屈折率・ロンボヘドロン' },      { id:'ank',  name:'鉄苦灰石 (Ankerite)',    nameJa:'鉄苦灰石',   system:'三方',   group:'炭酸塩',    nAlpha:1.523, nGamma:1.729, bire:0.200,  sign:'-', extinct:0,   tip:'苦灰石の鉄変種・高次干渉色・黄〜褐色' },      { id:'apt',  name:'燐灰石 (Apatite)',       nameJa:'燐灰石',     system:'六方',   group:'燐酸塩',    nAlpha:1.631, nGamma:1.634, bire:0.003,  sign:'-', extinct:0,   tip:'六角柱状・低複屈折・燐の主要鉱物' },      { id:'sph',  name:'スフェーン (Sphene)',    nameJa:'スフェーン', system:'単斜',   group:'チタン珪酸塩', nAlpha:1.885, nGamma:2.034, bire:0.100, sign:'+', extinct:51, tip:'菱形断面・高複屈折・高屈折率・ダイヤモンド光沢' },      { id:'rut',  name:'金紅石 (Rutile)',        nameJa:'金紅石',     system:'正方',   group:'酸化物',    nAlpha:2.616, nGamma:2.903, bire:0.287,  sign:'+', extinct:0,   tip:'非常に高屈折率・赤〜褐色・金属光沢' },      { id:'ilm',  name:'チタン鉄鉱 (Ilmenite)',  nameJa:'チタン鉄鉱', system:'三方',   group:'酸化物',    nAlpha:null,  nGamma:null,  bire:null,   sign:'不透明', extinct:null, tip:'不透明・金属光沢・TiO₂源' },      { id:'mgt',  name:'磁鉄鉱 (Magnetite)',     nameJa:'磁鉄鉱',     system:'等軸',   group:'酸化物',    nAlpha:null,  nGamma:null,  bire:null,   sign:'不透明', extinct:null, tip:'等軸晶系・磁性あり・常に不透明' },      { id:'pyr',  name:'黄鉄鉱 (Pyrite)',        nameJa:'黄鉄鉱',     system:'等軸',   group:'硫化物',    nAlpha:null,  nGamma:null,  bire:null,   sign:'不透明', extinct:null, tip:'等軸晶系・金属光沢・立方体形' },      { id:'tour', name:'電気石 (Tourmaline)',     nameJa:'電気石',     system:'三方',   group:'珪酸塩',    nAlpha:1.616, nGamma:1.638, bire:0.021,  sign:'-', extinct:0,   tip:'三角柱状・強い多色性(青〜緑〜褐色)・平行消光' },      { id:'stau', name:'十字石 (Staurolite)',    nameJa:'十字石',     system:'単斜',   group:'珪酸塩',    nAlpha:1.736, nGamma:1.761, bire:0.012,  sign:'+', extinct:0,   tip:'十字形双晶・黄褐色・多色性・中圧変成岩指標' },      { id:'woll', name:'珪灰石 (Wollastonite)',  nameJa:'珪灰石',     system:'三斜',   group:'珪酸塩',    nAlpha:1.616, nGamma:1.634, bire:0.016,  sign:'-', extinct:35,  tip:'長柱状・低変成岩指標・CaSiO₃・白色' },      { id:'anth', name:'直閃石 (Anthophyllite)', nameJa:'直閃石',     system:'直方',   group:'珪酸塩',    nAlpha:1.598, nGamma:1.628, bire:0.025,  sign:'+', extinct:0,   tip:'直方系角閃石・平行消光・緑〜褐色の多色性' },    ];    const CRYSTAL_SYSTEMS = [...new Set(MINERALS.map(m => m.system))];    // ===== State =====    let progress = {};    let deck = [];    let deckIndex = 0;    let currentCard = null;    let isFlipped = false;    let sessionCorrect = 0;    let sessionTotal = 0;    let studyMode = 'name-to-props';    let crystalFilter = 'all';    // ===== localStorage =====    function loadProgress() {      try { return JSON.parse(localStorage.getItem('minFlashProgress') || '{}'); } catch { return {}; }    }    function saveProgress() { localStorage.setItem('minFlashProgress', JSON.stringify(progress)); }    // ===== Tab =====    function switchTab(tab) {      ['study','list','stats'].forEach(t => {        document.getElementById('panel-' + t).classList.toggle('hidden', t !== tab);        const btn = document.getElementById('tab-' + t);        btn.setAttribute('aria-selected', t === tab ? 'true' : 'false');        if (t === tab) {          btn.classList.add('bg-white','text-indigo-900','shadow');          btn.classList.remove('text-indigo-700','hover:bg-indigo-200');        } else {          btn.classList.remove('bg-white','text-indigo-900','shadow');          btn.classList.add('text-indigo-700','hover:bg-indigo-200');        }      });      if (tab === 'list') renderList();      if (tab === 'stats') renderStats();    }    // ===== Crystal system filter buttons =====    function renderSysButtons() {      const container = document.getElementById('sys-buttons');      container.innerHTML = '';  // xss-ok: reviewed-internal-data      CRYSTAL_SYSTEMS.forEach(sys => {        const btn = document.createElement('button');        btn.id = 'sys-btn-' + sys;        btn.textContent = sys;        btn.className = 'px-2 py-0.5 rounded text-xs bg-gray-100 text-gray-700 hover:bg-indigo-100 focus:outline-none focus:ring-2 focus:ring-indigo-400 ml-1';        btn.onclick = () => setCrystalFilter(sys);        container.appendChild(btn);      });    }    function setCrystalFilter(sys) {      crystalFilter = sys;      const allBtn = document.getElementById('sys-btn-all');      allBtn.className = sys === 'all'        ? 'px-2 py-0.5 rounded text-xs bg-indigo-600 text-white focus:outline-none focus:ring-2 focus:ring-indigo-400'        : 'px-2 py-0.5 rounded text-xs bg-gray-100 text-gray-700 hover:bg-indigo-100 focus:outline-none focus:ring-2 focus:ring-indigo-400';      CRYSTAL_SYSTEMS.forEach(s => {        const b = document.getElementById('sys-btn-' + s);        if (b) b.className = s === sys          ? 'px-2 py-0.5 rounded text-xs bg-indigo-600 text-white focus:outline-none focus:ring-2 focus:ring-indigo-400 ml-1'          : 'px-2 py-0.5 rounded text-xs bg-gray-100 text-gray-700 hover:bg-indigo-100 focus:outline-none focus:ring-2 focus:ring-indigo-400 ml-1';      });      buildDeck();      showCard();    }    function setMode(mode) {      studyMode = mode;      buildDeck();      showCard();    }    // ===== Deck =====    function buildDeck() {      let filtered = crystalFilter === 'all' ? [...MINERALS] : MINERALS.filter(m => m.system === crystalFilter);      if (studyMode === 'spaced') {        const weighted = [];        filtered.forEach(m => {          const p = progress[m.id] || { correct: 0, incorrect: 0 };          const total = p.correct + p.incorrect;          const errorRate = total > 0 ? p.incorrect / total : 0.5;          const weight = Math.max(1, Math.round(1 + errorRate * 3));          for (let i = 0; i < weight; i++) weighted.push(m);        });        deck = shuffleArray(weighted);      } else {        deck = shuffleArray(filtered);      }      deckIndex = 0;      sessionCorrect = 0;      sessionTotal = 0;      updateProgress();    }    function shuffleArray(arr) {      const a = [...arr];      for (let i = a.length - 1; i > 0; i--) {        const j = Math.floor(Math.random() * (i + 1));        [a[i], a[j]] = [a[j], a[i]];      }      return a;    }    function formatBire(v) {      if (v === null || v === undefined) return '不透明';      return v.toFixed(3);    }    function formatN(v) {      if (v === null || v === undefined) return '-';      return v.toFixed(3);    }    // ===== Card Display =====    function showCard() {      document.getElementById('session-complete').classList.add('hidden');      document.getElementById('flash-card').parentElement.style.display = '';      if (deckIndex >= deck.length) {        finishSession();        return;      }      currentCard = deck[deckIndex];      isFlipped = false;      document.getElementById('flash-card').classList.remove('flipped');      document.getElementById('answer-buttons').classList.add('hidden');      document.getElementById('next-button').classList.remove('hidden');      // Set crystal shape color based on sign      const shapeColors = { '+': '#dbeafe', '-': '#fce7f3', '等方': '#d1fae5', '不透明': '#f3f4f6' };      document.getElementById('crystal-shape').style.fill = shapeColors[currentCard.sign] || '#e0e7ff';      // Front      document.getElementById('f-system').textContent = currentCard.system + '晶系';      document.getElementById('f-group').textContent = currentCard.group;      if (studyMode === 'biref-to-name') {        document.getElementById('f-question-label').textContent = 'この複屈折値の鉱物は？';        document.getElementById('f-main').textContent = currentCard.bire !== null          ? 'δ = ' + formatBire(currentCard.bire) : '不透明鉱物';        document.getElementById('f-sub').textContent =          currentCard.nAlpha !== null ? 'nα=' + formatN(currentCard.nAlpha) + '  nγ=' + formatN(currentCard.nGamma) : '光学特性なし';      } else {        document.getElementById('f-question-label').textContent = 'この鉱物の光学特性は？';        document.getElementById('f-main').textContent = currentCard.name;        document.getElementById('f-sub').textContent = currentCard.system + '晶系 · ' + currentCard.group;      }      // Back      document.getElementById('b-mineral-name').textContent = currentCard.name;      const propsHtml = buildPropsHtml(currentCard);      document.getElementById('b-props').innerHTML = propsHtml;  // xss-ok: reviewed-internal-data      document.getElementById('b-tip').textContent = currentCard.tip;      updateProgress();    }    function buildPropsHtml(m) {      const rows = [        ['nα (最小屈折率)', formatN(m.nAlpha)],        ['nγ (最大屈折率)', formatN(m.nGamma)],        ['複屈折 (δ)', m.bire !== null ? formatBire(m.bire) : '不透明'],        ['光学符号', m.sign],        ['消光角', m.extinct !== null ? m.extinct + '°' : '-'],        ['晶系', m.system + '晶系'],      ];      return rows.map(([label, val]) =>        `<span class="text-indigo-300 text-xs">${label}</span><span class="font-bold">${val}</span>`      ).join('');    }    function flipCard() {      if (isFlipped) return;      isFlipped = true;      document.getElementById('flash-card').classList.add('flipped');      document.getElementById('answer-buttons').classList.remove('hidden');      document.getElementById('next-button').classList.add('hidden');    }    function markCard(correct) {      if (!currentCard) return;      if (!progress[currentCard.id]) progress[currentCard.id] = { correct: 0, incorrect: 0 };      if (correct) { progress[currentCard.id].correct++; sessionCorrect++; }      else { progress[currentCard.id].incorrect++; }      progress[currentCard.id].lastSeen = Date.now();      sessionTotal++;      saveProgress();      deckIndex++;      showCard();    }    function nextCard() {      deckIndex++;      showCard();    }    function updateProgress() {      const remaining = deck.length - deckIndex;      document.getElementById('remaining').textContent = remaining + '枚';      const pct = deck.length > 0 ? Math.round((deckIndex / deck.length) * 100) : 0;      document.getElementById('prog-bar').style.width = pct + '%';      document.getElementById('prog-bar-wrap').setAttribute('aria-valuenow', pct);      document.getElementById('sess-score').textContent = sessionCorrect + '/' + sessionTotal;    }    function finishSession() {      document.getElementById('flash-card').parentElement.style.display = 'none';      document.getElementById('answer-buttons').classList.add('hidden');      document.getElementById('next-button').classList.add('hidden');      document.getElementById('session-complete').classList.remove('hidden');      const acc = sessionTotal > 0 ? Math.round((sessionCorrect / sessionTotal) * 100) : 0;      document.getElementById('sess-result').textContent =        `正解 ${sessionCorrect} / ${sessionTotal} 枚 (${acc}%)`;    }    function restartSession() {      buildDeck();      document.getElementById('flash-card').parentElement.style.display = '';      showCard();    }    // ===== List =====    function renderList() {      const tbody = document.getElementById('list-tbody');      tbody.innerHTML = '';  // xss-ok: reviewed-internal-data      MINERALS.forEach(m => {        const p = progress[m.id] || { correct: 0, incorrect: 0 };        const total = p.correct + p.incorrect;        const acc = total > 0 ? Math.round((p.correct / total) * 100) : null;        const tr = document.createElement('tr');        tr.className = 'border-t border-indigo-50 hover:bg-indigo-50';        // xss-ok: reviewed-internal-data
        tr.innerHTML = `
          <td class="p-2 font-medium text-gray-800">${escH(m.nameJa)}</td>          <td class="p-2 text-gray-600">${escH(m.system)}</td>          <td class="p-2 text-right font-mono">${formatN(m.nAlpha)}</td>          <td class="p-2 text-right font-mono">${formatN(m.nGamma)}</td>          <td class="p-2 text-right font-mono">${formatBire(m.bire)}</td>          <td class="p-2 text-center font-bold ${m.sign === '+' ? 'text-blue-600' : m.sign === '-' ? 'text-pink-600' : 'text-gray-500'}">${m.sign}</td>          <td class="p-2 text-right ${acc === null ? 'text-gray-300' : acc >= 70 ? 'text-green-600' : 'text-red-500'} font-bold">${acc !== null ? acc+'%' : '-'}</td>        `; // xss-ok: formatN/formatBire=computed, m.sign=internal constant, acc=computed        tbody.appendChild(tr);      });    }    // ===== Stats =====    function renderStats() {      const totalAns = Object.values(progress).reduce((s,p) => s + p.correct + p.incorrect, 0);      const totalCor = Object.values(progress).reduce((s,p) => s + p.correct, 0);      document.getElementById('st-total').textContent = totalAns;      document.getElementById('st-acc').textContent = totalAns > 0 ? Math.round(totalCor/totalAns*100)+'%' : '-';      // Weak minerals      const weak = document.getElementById('weak-minerals');      weak.innerHTML = '';  // xss-ok: reviewed-internal-data      const weakList = MINERALS.filter(m => {        const p = progress[m.id];        if (!p) return false;        const t = p.correct + p.incorrect;        return t > 0 && p.correct / t < 0.7;      }).sort((a,b) => {        const pa = progress[a.id], pb = progress[b.id];        return (pa.correct/(pa.correct+pa.incorrect)) - (pb.correct/(pb.correct+pb.incorrect));      });      if (weakList.length === 0) {        weak.innerHTML = '<p class="text-xs text-gray-400">要復習なし</p>';  // xss-ok: reviewed-internal-data      } else {        weakList.slice(0,8).forEach(m => {          const p = progress[m.id];          const acc = Math.round(p.correct/(p.correct+p.incorrect)*100);          const div = document.createElement('div');          div.className = 'flex items-center justify-between py-1 border-b border-gray-100 text-sm';          div.innerHTML = `<span class="text-gray-700">${escH(m.name)}</span><span class="text-red-500 font-bold">${acc}%</span>`; // xss-ok: acc=computed value          weak.appendChild(div);        });      }      // By crystal system      const sysContainer = document.getElementById('stats-by-system');      sysContainer.innerHTML = '';  // xss-ok: reviewed-internal-data      CRYSTAL_SYSTEMS.forEach(sys => {        const ms = MINERALS.filter(m => m.system === sys);        const totals = ms.map(m => progress[m.id] || { correct:0, incorrect:0 });        const tA = totals.reduce((s,p) => s+p.correct+p.incorrect, 0);        const tC = totals.reduce((s,p) => s+p.correct, 0);        const acc = tA > 0 ? Math.round(tC/tA*100) : null;        const div = document.createElement('div');        div.className = 'flex items-center gap-2';        // xss-ok: reviewed-internal-data
        div.innerHTML = `
          <span class="text-xs text-gray-600 w-16 flex-shrink-0">${escH(sys)}</span>          <div class="flex-1 bg-gray-200 rounded h-2">            <div class="bg-indigo-500 h-2 rounded" style="width:${acc || 0}%"></div>          </div>          <span class="text-xs font-bold ${acc === null ? 'text-gray-300' : acc >= 70 ? 'text-green-600' : 'text-red-500'} w-10 text-right">${acc !== null ? acc+'%' : '-'}</span>        `; // xss-ok: acc=computed value        sysContainer.appendChild(div);      });    }    function clearStats() {      if (!confirm('学習統計をリセットしますか？')) return;      progress = {};      saveProgress();      renderStats();    }    function escH(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }    // ===== Init =====    function init() {      progress = loadProgress();      renderSysButtons();      buildDeck();      showCard();    }    init();  </script></body></html>
